name: Swarup Wokflow


on: 
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: " */5 * * * * "


jobs:
  Print_Hello:
    name: Swarup CI
    runs-on: ubuntu-latest

    steps:
      - name: Printing Runner or Instance variables
        run: |
          echo "Hello, the workflow event is ${{ github.event_name }}"
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Temp: $RUNNER_TEMP"
          whoami



  
              
